name: Bug report
description: Report a reproducible player, tooling, or showcase problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private dataset URLs, credentials, or security reports.
  - type: input
    id: commit
    attributes:
      label: Commit
      placeholder: Git SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Showcase,
          Player core,
          PlayCanvas/SOG,
          Babylon/SPZ,
          Spark/RAD,
          Content tools,
          Documentation,
        ]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description:
        Include steps, expected/actual behavior, and a public or synthetic manifest when
        possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description:
        Device, OS, browser/version, backend, XR flags, content splat counts, and build
        mode.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed private URLs, secrets, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
