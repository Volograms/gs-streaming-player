name: Feature request
description: Propose an improvement to the public preview
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Compatibility and tradeoffs
      description: Note public API, schema, renderer, Quest, or content-pipeline impact.
